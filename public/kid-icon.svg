<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  fill="none"
  data-mark-viewbox="91 128 331 268"
>
  <!--
    Dečiji režim ("Moj dan") home-screen icon: a house with a tree, drawn to
    read like the 🏡 emoji without shipping Apple's artwork (that glyph is
    theirs, and an emoji in an SVG renders differently on every platform, so
    the favicon and the installed tile would not match).

    Square on purpose: iOS and Android apply their own masks. Every mark stays
    inside a circle of radius 186 around the centre (73% of the half-width),
    well within the 80% Android maskable safe zone, so a circular mask never
    clips the tree crown or the bush.

    Indigo-violet + muted brick is deliberately NOT any of the kid themes: the
    child picks the theme, the icon has to sit happily next to all of them, and
    next to the parent app's royal-blue tile it has to read as a different app
    at a glance. Three colours instead of the emoji's six keep it calm at
    favicon size.

    TWO ATTRIBUTES THE BUILD READS, so redraw them along with the artwork
    (`scripts/generate-kid-svgs.ts` fails loudly if either goes missing):
    - `data-tile-background` marks the full-bleed background. `kid-mark.svg`,
      the mark on the sign-in screen, is this drawing WITHOUT it - the screen
      is already the tile colour, so the tile itself would be invisible.
    - `data-mark-viewbox` is the bounding box of everything else, so that mark
      crops to the drawing instead of carrying the tile's empty margins. Widest
      points today: the tree crown on the left, the stroked roof on the right,
      the crown again on top, the bush at the bottom - plus 6 units of margin,
      because an SVG clips at its viewport and a shape that ends exactly on the
      edge gets its anti-aliased rim shaved off.
  -->
  <!-- SVG is XML, so the flag needs a value even though only its name matters. -->
  <rect width="512" height="512" fill="#443591" data-tile-background="true"/>
  <path
    d="M291 150 L404 254 H176 Z"
    fill="#C9584B"
    stroke="#C9584B"
    stroke-width="24"
    stroke-linejoin="round"
  />
  <rect x="196" y="256" width="190" height="132" rx="16" fill="#F7EAD6"/>
  <rect x="216" y="298" width="40" height="40" rx="10" fill="#FFC960"/>
  <path d="M266 322 a26 26 0 0 1 52 0 v66 h-52 z" fill="#8A5C3E"/>
  <rect x="158" y="228" width="26" height="160" rx="10" fill="#7B5A41"/>
  <circle cx="171" cy="208" r="74" fill="#4FA96B"/>
  <circle cx="372" cy="364" r="26" fill="#4FA96B"/>
</svg>
