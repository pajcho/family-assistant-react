# Minimal config for Supabase CLI (db push, link).
# See https://supabase.com/docs/guides/cli/config
project_id = "family-assistant"

[db]
major_version = 17

[db.migrations]
enabled = true


# subscribe-push is called from the client with a user JWT - keep the
# default verify_jwt = true so RLS protects the upsert.
#
# send-due-pushes is called from pg_cron, not from a user session, so
# there's no client JWT to verify. We turn verify_jwt off and instead
# require a shared CRON_SECRET in the X-Cron-Secret header (both the
# function and the cron job read it from Supabase secrets / Postgres
# settings). Anything without the matching secret is rejected before
# touching the DB.
[functions.send-due-pushes]
verify_jwt = false

# notify-on-create is invoked by AFTER INSERT triggers via pg_net, not by
# a user session. Same X-Cron-Secret pattern as send-due-pushes.
[functions.notify-on-create]
verify_jwt = false

# gcal-oauth-callback is hit by Google's OAuth redirect - a top-level browser
# navigation with no Supabase session, so there's no JWT to verify. Security
# comes from the HMAC-signed `state` that gcal-oauth-start issued. The other
# gcal functions (gcal-oauth-start, gcal-disconnect, gcal-calendars) are called
# from the client with the user's session and keep the default verify_jwt = true.
[functions.gcal-oauth-callback]
verify_jwt = false

# gcal-sync is fired by pg_cron, not a user session - same X-Cron-Secret pattern
# as send-due-pushes.
[functions.gcal-sync]
verify_jwt = false

# receipt-import is called from the client with the member's session to fetch +
# parse a fiscal-receipt page (suf.purs.gov.rs). verify_jwt = true (the default,
# stated explicitly) so only authenticated members can invoke it; the function
# itself does no DB work (the client saves the parsed receipt through the normal
# RLS-protected expenses insert path).
[functions.receipt-import]
verify_jwt = true

# kid-auth is what a child calls to GET a session, so by definition there is no
# JWT to verify yet - the same situation as gcal-oauth-callback. It is the only
# function whose whole job runs before authentication, so it is the only place
# this exception applies; kid-access (the parent side) keeps the default
# verify_jwt = true.
#
# What stands in for the JWT is two factors the function checks itself:
#   1. a device token - 32 CSPRNG bytes a parent planted via a one-time QR link,
#      stored only as SHA-256, with no username field and no name lookup, so the
#      endpoint can't be used to enumerate a family's children; and
#   2. a PIN, PBKDF2-hashed, behind a 5-strike / 15-minute lockout that makes a
#      4-digit secret defensible.
# Neither the invite nor the device token is guessable, and every wrong PIN costs
# an attempt, so an unauthenticated caller has nothing to work with.
#
# The `check` action (does this device still have access?) is the one that runs
# WITH a session, but it lives here rather than in a verify_jwt = true function
# for the same reason as the rest: it is answered from the device token alone,
# returns only ok / device_unknown / access_disabled, and hands back no data.
[functions.kid-auth]
verify_jwt = false

# exchange-rate is called from the client while a member types a foreign-currency
# expense; it resolves the official NBS middle rate for a (currency, date) pair,
# caching results in `exchange_rates` via the service role (members are
# SELECT-only there). verify_jwt = true so only signed-in members can trigger
# upstream fetches.
[functions.exchange-rate]
verify_jwt = true
